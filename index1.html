    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="mainFullbody">
        <header id="fheader">
            <h1>Profile Seeker</h1>
            <nav id="navsection">
                <a href="level.html">About Level</a>
                <span>/</span>
                <a href="aboutus.html">About Us</a>
            </nav>
            <button id="light_dakrmode" type="button" aria-label="Toggle light and dark theme">
                <i class="fa-solid fa-sun removeDisplay" id="sun"></i>
                <i class="fa-solid fa-moon" id="moon"></i>
            </button>
        </header>

        <div id="fbody">
            <div class="search-box-glow">
                <div class="searchInput">
                    <h2>See Your <strong>LeetCode Profile in a new way</strong></h2>

                    <form action="#">
                        <input
                            type="text"
                            id="userProfileName"
                            placeholder="Enter username"
                            autocomplete="off"
                            required
                        />
                        <button id="search-btn" type="submit">Search</button>
                    </form>
                </div>

                <svg class="search-glow-container">
                    <rect class="search-glow-blur" pathLength="100"></rect>
                    <rect class="search-glow-line" pathLength="100"></rect>
                </svg>
            </div>
        </div>

        <footer id="ffooter"></footer>
    </div>

    <script src="script.js"></script>
</body>
